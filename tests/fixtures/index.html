<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Fixture</title>
    <meta
      name="description"
      content="A page that every HTML rule accepts."
    />
    <meta
      content="Fixture"
      property="og:title"
    />
    <meta
      content="website"
      property="og:type"
    />
    <meta
      content="https://example.com/"
      property="og:url"
    />
    <meta
      content="https://example.com/cover.png"
      property="og:image"
    />
    <meta
      content="A page that every HTML rule accepts."
      property="og:description"
    />
  </head>
  <body>
    <main>
      <h1>Fixture</h1>
      <img
        src="cover.png"
        alt="A cover image"
        decoding="async"
        height="360"
        loading="lazy"
        width="640"
      />
      <p>Every rule of the configuration accepts this page.</p>
      <a href="https://example.com/">Example</a>
    </main>
  </body>
</html>
