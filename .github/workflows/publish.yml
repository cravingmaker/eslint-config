name: Publish to npm

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # Runs every check and packs the release without the permission to publish.
  verify:
    name: Verify release
    # Prereleases and template repositories are not published.
    if: ${{ !github.event.release.prerelease && !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      name: ${{ steps.pack.outputs.name }}
      node-version: ${{ steps.pack.outputs.node-version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      # No dependency cache: a release installs from the lockfile alone.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package version ${PACKAGE_VERSION}. Expected ${EXPECTED_TAG}."
            exit 1
          fi

      - name: Verify release source
        run: |
          git fetch --no-tags --depth=1 origin main

          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::Release tag must point to a commit reachable from main."
            exit 1
          fi

      - name: Verify version is unpublished
        run: |
          PACKAGE_NAME="$(node --print "require('./package.json').name")"
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION} is already published."
            exit 1
          fi

      # devEngines requires npm 11.15.0 or later, which staged publishing needs.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Verify release readiness
        run: npm run release:check

      - name: Pack release artifact
        id: pack
        run: |
          mkdir -p .release
          npm pack --ignore-scripts --json --pack-destination .release > .release/pack.json

          TARBALL="$(node <<'NODE'
          const fs = require('node:fs');
          const artifacts = JSON.parse(fs.readFileSync('.release/pack.json', 'utf8'));

          if (!Array.isArray(artifacts) || artifacts.length !== 1 || !artifacts[0]?.filename) {
            console.error('Expected npm pack to produce exactly one tarball.');
            process.exit(1);
          }

          process.stdout.write(artifacts[0].filename);
          NODE
          )"

          {
            echo "name=$(node --print "require('./package.json').name")"
            echo "node-version=$(node --print process.versions.node)"
            echo "sha256=$(sha256sum ".release/${TARBALL}" | cut -d ' ' -f 1)"
            echo "tarball=.release/${TARBALL}"
          } >> "${GITHUB_OUTPUT}"
          sha256sum ".release/${TARBALL}"

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  # Holds the permission to publish and runs no code of the repository or its dependencies.
  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deploys only from v* tags; the trusted publisher on npm requires this environment.
    environment: npm
    permissions:
      id-token: write # Authenticate to npm with trusted publishing and sign provenance.
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.verify.outputs.node-version }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: .release

      - name: Verify release artifact
        env:
          SHA256: ${{ needs.verify.outputs.sha256 }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
        run: echo "${SHA256}  ${TARBALL}" | sha256sum --check --strict

      # A stage-only trusted publisher accepts staged versions, which a maintainer approves with
      # 2FA. Staging needs an existing package, so a package's first version publishes directly.
      - name: Publish release artifact
        env:
          PACKAGE_NAME: ${{ needs.verify.outputs.name }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
        run: |
          if npm view "${PACKAGE_NAME}" name >/dev/null 2>&1; then
            npm stage publish "${TARBALL}" --access public --provenance --ignore-scripts
          else
            npm publish "${TARBALL}" --access public --ignore-scripts
          fi
