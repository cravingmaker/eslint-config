name: Publish to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      HUSKY: 0

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package version ${PACKAGE_VERSION}. Expected ${EXPECTED_TAG}."
            exit 1
          fi

      - name: Verify publishing toolchain
        run: |
          node --version
          npm --version
          node <<'NODE'
          const { execFileSync } = require('node:child_process');

          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const current = version.split('.').map(Number);
          const minimum = [11, 5, 1];

          for (let index = 0; index < minimum.length; index += 1) {
            if (current[index] > minimum[index]) process.exit(0);
            if (current[index] < minimum[index]) {
              console.error(`npm >=11.5.1 is required for trusted publishing; found ${version}`);
              process.exit(1);
            }
          }
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate
        run: npm run validate

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public --ignore-scripts
