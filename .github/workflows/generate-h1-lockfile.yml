name: Generate H1 lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lockfile:
    if: github.head_ref == 'chore/modernize-eslint-core-dependencies'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Inspect snapshot-compatible H1 versions
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const packages = [
            'eslint',
            'typescript-eslint',
            '@eslint/json',
            '@eslint/markdown',
            'globals',
            'jsonc-eslint-parser',
            'eslint-import-resolver-typescript',
          ];
          const cutoff = new Date('2026-09-19T16:36:26Z');
          for (const pkg of packages) {
            const raw = execFileSync('npm', ['view', pkg, 'time', '--json'], { encoding: 'utf8' });
            const times = JSON.parse(raw);
            const candidates = Object.entries(times)
              .filter(([version, published]) => /^\\d+\\.\\d+\\.\\d+$/.test(version) && new Date(published) <= cutoff)
              .map(([version]) => version)
              .sort((a, b) => {
                const aa = a.split('.').map(Number);
                const bb = b.split('.').map(Number);
                return aa[0] - bb[0] || aa[1] - bb[1] || aa[2] - bb[2];
              });
            console.log(`${pkg}=${candidates.at(-1)}`);
          }
          NODE
