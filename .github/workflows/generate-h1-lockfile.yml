name: Generate H1 lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lockfile:
    if: github.head_ref == 'chore/modernize-eslint-core-dependencies'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Print compressed lockfile
        run: |
          printf 'LOCKFILE_GZIP_BASE64='
          gzip -c package-lock.json | base64 -w0
          printf '\n'
