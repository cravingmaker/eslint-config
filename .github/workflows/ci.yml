name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

# Supersede outdated pull request runs; every main commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up development Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Run static checks
        run: npm run validate:static

      - name: List package contents
        run: npm pack --dry-run --ignore-scripts

  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported runtime and the newest release of the current line.
        node-version:
          - 24.15.0
          - 26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install and build with the contributor toolchain, whose npm satisfies devEngines.
      - name: Set up development Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build package
        run: npm run build

      # Resolve the newest release of the line instead of an older cached runner copy. The cache
      # stays off: setting it up runs npm, and the npm of Node.js 24.15.0 fails the devEngines check.
      - name: Set up runtime Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          package-manager-cache: false

      - name: Capture runtime executable
        id: runtime-node
        run: echo "executable=$(node --print process.execPath)" >> "$GITHUB_OUTPUT"

      # `node --run` skips npm's devEngines check, which the npm of Node.js 24.15.0 fails.
      - name: Test
        run: node --run test:unit:built

      # npm packs and installs with the contributor toolchain again; the consumer programs run on
      # the runtime Node.js.
      - name: Restore development Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Test packed consumers
        env:
          ESLINT_CONFIG_CONSUMER_NODE: ${{ steps.runtime-node.outputs.executable }}
        run: npm run test:package:built

  macos:
    name: macOS packed consumers
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up development Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The temporary directory of macOS is a symbolic link, which Linux runners do not show.
      - name: Test packed consumers
        run: npm run test:package

  minimum-peers:
    name: Minimum peer versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install, build, and pack with the contributor toolchain, whose npm satisfies devEngines.
      - name: Set up development Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build and pack package
        id: pack
        run: |
          npm ci --ignore-scripts
          npm run build
          echo "tarball=$(npm pack --ignore-scripts --silent)" >> "$GITHUB_OUTPUT"

      # The floor of every peer range in package.json; a range without an explicit floor fails.
      - name: Read advertised minimum peers
        id: peers
        run: |
          node --input-type=module >> "$GITHUB_OUTPUT" <<'NODE'
          import { readFileSync } from 'node:fs';

          const { peerDependencies } = JSON.parse(readFileSync('package.json', 'utf8'));
          const peers = Object.entries(peerDependencies).map(([name, range]) => {
            const floor = /^>=(\d+\.\d+\.\d+)(?:\s|$)/u.exec(range)?.[1];
            if (floor === undefined) {
              throw new Error(`Declare an explicit floor for the peer ${name}: ${range}`);
            }
            return `${name}@${floor}`;
          });
          console.log(`list=${peers.join(' ')}`);
          NODE

      # The consumer project has no devEngines, so the npm of Node.js 24.15.0 installs it. The
      # cache stays off: setting it up runs npm in this repository, which fails the devEngines check.
      - name: Set up minimum Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      # Installing the advertised lower bounds outside a lockfile is the point of this job. The
      # consumer lives outside the checkout, so npm reads neither the package.json nor the .npmrc of
      # this repository, and Node.js cannot fall back to its node_modules.
      - name: Install advertised minimum peers
        env:
          PEERS: ${{ steps.peers.outputs.list }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: | # zizmor: ignore[adhoc-packages]
          read -ra peers <<< "${PEERS}"
          mkdir -p "${RUNNER_TEMP}/minimum-peer-consumer"
          cd "${RUNNER_TEMP}/minimum-peer-consumer"
          npm init --yes >/dev/null
          npm pkg set type=module >/dev/null
          npm install --ignore-scripts --save-exact "$GITHUB_WORKSPACE/$TARBALL" "${peers[@]}"
          npm ls --all

      - name: Verify minimum peer integrations
        working-directory: ${{ runner.temp }}/minimum-peer-consumer
        run: |
          node --input-type=module <<'NODE'
          import { ESLint } from 'eslint';
          import { createConfig } from '@cravingmaker/eslint-config';

          const config = await createConfig({ express: true, react: { refresh: 'vite' }, svelte: true, vitest: true });
          const pluginNames = new Set(config.flatMap((entry) => Object.keys(entry.plugins ?? {})));

          for (const plugin of [
            '@html-eslint/react',
            '@html-eslint/svelte',
            'express-security',
            'react-hooks',
            'react-refresh',
            'vitest',
          ]) {
            if (!pluginNames.has(plugin)) {
              throw new Error(`Minimum peer integration was not loaded: ${plugin}`);
            }
          }

          const eslint = new ESLint({ overrideConfig: config, overrideConfigFile: true });
          const fixtures = [
            ['component.jsx', 'export default function Component() { return <div />; }'],
            ['component.svelte', '<script lang="ts">const value: number = 1;</script><p>{value}</p>'],
            ['server.js', 'export const app = {};'],
            ['server.test.js', "import { expect, it } from 'vitest';\n\nit('starts', () => {\n  expect(1).toBe(1);\n});\n"],
          ];

          for (const [filePath, code] of fixtures) {
            const results = await eslint.lintText(code, { filePath });
            const fatalMessages = results.flatMap((result) => result.messages).filter((message) => message.fatal);
            if (fatalMessages.length !== 0) {
              throw new Error(`${filePath} failed with the advertised minimum peers`);
            }
          }
          NODE

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up development Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # npm audit reads the lockfile, so nothing is installed. As its own job, an advisory that
      # was published after the last dependency change fails CI without hiding other results.
      - name: Audit dependencies
        run: npm audit --audit-level=low

  dependency-review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Compares the pull request's base and head dependency graphs; no checkout is needed.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  # The single status for rulesets: it fails unless every job above succeeded.
  # Dependency Review is skipped outside pull requests.
  result:
    name: CI result
    if: ${{ always() }}
    needs:
      - static
      - test
      - macos
      - minimum-peers
      - audit
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq --raw-output 'to_entries[]
            | select(.value.result != "success" and (.key != "dependency-review" or .value.result != "skipped"))
            | "\(.key)=\(.value.result)"' <<< "${NEEDS}")"

          if [ -n "${failed}" ]; then
            echo "::error::CI jobs did not succeed: $(echo "${failed}" | tr '\n' ' ')"
            exit 1
          fi
