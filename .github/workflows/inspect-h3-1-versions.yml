name: Inspect H3.1 versions

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'chore/modernize-typescript-build-toolchain'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Inspect package versions and peer ranges
        run: |
          for pkg in typescript tsdown @types/node; do
            echo "=== $pkg ==="
            npm view "$pkg" version
            npm view "$pkg" peerDependencies --json || true
            npm view "$pkg" engines --json || true
          done
