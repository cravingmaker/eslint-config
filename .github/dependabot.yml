version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      # Vitest and its UI require matching exact versions, in security updates too.
      vitest:
        applies-to: version-updates
        patterns:
          - vitest
          - "@vitest/ui"
      vitest-security:
        applies-to: security-updates
        patterns:
          - vitest
          - "@vitest/ui"
    ignore:
      # Node.js types follow the minimum supported runtime major in `engines`.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # TypeScript majors wait for typescript-eslint support.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
